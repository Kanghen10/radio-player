<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radio Player with Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    #albumArt {
      width: 200px;
      height: 200px;
      background: #111 center/cover no-repeat;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    #status {
      margin-bottom: 10px;
      font-size: 16px;
      color: #ccc;
      text-align: center;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    #playBtn {
      background: blue;
      color: white;
      border: 1px solid #444;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
      transition: box-shadow 0.3s ease;
    }
    #playBtn:hover { background: #0040ff; }
    #playBtn.playing {
      animation: pulseGlow 1.5s infinite;
      box-shadow: 0 0 10px rgba(0, 128, 255, 0.7);
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px rgba(0, 128, 255, 0.7); }
      50% { box-shadow: 0 0 25px rgba(0, 128, 255, 1); }
      100% { box-shadow: 0 0 10px rgba(0, 128, 255, 0.7); }
    }
    #stopBtn {
      background: red;
      color: white;
      border: 1px solid #444;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    #stopBtn:hover { background: #cc0000; }
    #visualizer { width: 100%; height: 200px; }
    #modeToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      font-size: 14px;
      color: white;
    }
  </style>

  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
</head>
<body>
  <div id="albumArt"></div>
  <div id="status">Tekan tombol Play untuk memutar Radio</div>
  <canvas id="visualizer"></canvas>
  <div id="controls">
    <button id="playBtn">PLAY</button>
    <button id="stopBtn">STOP</button>
  </div>
  <button id="modeToggle">Mode: Bar</button>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const modeToggle = document.getElementById('modeToggle');
    const statusText = document.getElementById('status');

    const CORS_FALLBACK = "https://api.allorigins.win/raw?url=";

    const modes = ['bar', 'wave', 'circle'];
    let modeIndex = 0;
    let mode = modes[modeIndex];
    let hue = 0;

    let audioContext, source, analyser, dataArray, bufferLength, animationId;
    let hls = null, dashPlayer = null;
    let hasTriedPlay = false;

    function setStatus(t){ statusText.textContent = t; }
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = 200;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioContext() {
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          source = audioContext.createMediaElementSource(audio);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);
          source.connect(analyser);
          analyser.connect(audioContext.destination);
        } catch (e) {
          console.warn('AudioContext init failed', e);
        }
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!analyser) return;

      if (mode === 'bar') {
        analyser.getByteFrequencyData(dataArray);
        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i] / 2;
          ctx.fillStyle = 'rgb(' + (barHeight + 100) + ',50,50)';
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
          if (x > canvas.width) break;
        }
      } else if (mode === 'wave') {
        analyser.getByteTimeDomainData(dataArray);
        ctx.beginPath();
        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (mode === 'circle') {
        analyser.getByteTimeDomainData(dataArray);
        const radius = 80;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.beginPath();
        for (let i = 0; i < bufferLength; i++) {
          const angle = (i / bufferLength) * 2 * Math.PI;
          const v = (dataArray[i] - 128) / 128.0; // centered
          const r = radius + v * 60;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        hue = (hue + 2) % 360;
        const color = `hsl(${hue}, 100%, 60%)`;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 25;
        ctx.shadowColor = color;
        ctx.stroke();
        // plasma fill
        const gradient = ctx.createRadialGradient(centerX, centerY, radius*0.2, centerX, centerY, radius + 60);
        gradient.addColorStop(0, `hsla(${hue},100%,60%,0.45)`);
        gradient.addColorStop(1, `hsla(${(hue+60)%360},100%,50%,0.05)`);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function stopVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // --- helper: fetch text with CORS fallback (useful for m3u/pls)
    async function fetchTextWithFallback(url) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.text();
      } catch (e) {
        // fallback via allorigins
      }
      try {
        const r2 = await fetch(CORS_FALLBACK + encodeURIComponent(url));
        if (r2.ok) return await r2.text();
      } catch (e2) {}
      return null;
    }

    // parse playlist files (.m3u, .pls)
    function parseM3U(text, baseUrl) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for (const l of lines) {
        if (l.startsWith('#')) continue;
        if (l.startsWith('http')) return l;
        if (baseUrl) {
          try { return (new URL(l, baseUrl)).href; } catch(e){}
        }
      }
      return null;
    }
    function parsePLS(text) {
      const lines = text.split(/\r?\n/);
      for (const l of lines) {
        if (/^File\d+=/i.test(l)) {
          const v = l.split('=')[1].trim();
          if (v) return v;
        }
      }
      return null;
    }
    async function tryResolvePlaylist(url) {
      const lower = (url||'').toLowerCase();
      if (lower.endsWith('.m3u') || lower.includes('.m3u')) {
        const txt = await fetchTextWithFallback(url);
        if (txt) return parseM3U(txt, url);
      }
      if (lower.endsWith('.pls') || lower.includes('.pls')) {
        const txt = await fetchTextWithFallback(url);
        if (txt) return parsePLS(txt);
      }
      return null;
    }

    // cleanup players
    function cleanupPlayers() {
      if (hls) { try{ hls.destroy(); }catch(e){} hls = null; }
      if (dashPlayer) { try{ dashPlayer.reset(); }catch(e){} dashPlayer = null; }
    }

    // smart detect and play
    async function detectStreamTypeAndPlay(url) {
      cleanupPlayers();
      hasTriedPlay = true;
      setStatus('Sedang Loading Radio...');
      const lower = (url||'').toLowerCase().trim();

      // resolve playlists first (m3u/pls)
      try {
        const maybe = await tryResolvePlaylist(url);
        if (maybe) {
          url = maybe;
        }
      } catch(e){ /* ignore */ }

      // HLS
      if (lower.endsWith('.m3u8') || url.toLowerCase().includes('.m3u8')) {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(audio);
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          audio.src = url;
        } else {
          setStatus('Browser tidak mendukung HLS');
          return;
        }
      }
      // DASH
      else if (lower.endsWith('.mpd')) {
        try {
          dashPlayer = dashjs.MediaPlayer().create();
          dashPlayer.initialize(audio, url, false);
        } catch (e) {
          console.warn('dash init fail', e);
          audio.src = url;
        }
      }
      // Shoutcast/Icecast "end with /;" (common) — attempt several fallbacks
      else if (/\/;(\?.*)?$/.test(url)) {
        // Try plain url first (some servers serve directly)
        audio.src = url;
        // also prepare an alternate form used by some shoutcast servers
        // if playback fails we'll try adding "type=.mp3" later in error handler
      }
      // otherwise direct assign (mp3,aac,ogg,opus, etc.)
      else {
        audio.src = url;
      }

      // Try to play. If autoplay blocked: just show "Tekan tombol Play..." (no error flash)
      audio.play().then(()=> {
        initAudioContext();
        drawVisualizer();
      }).catch(async (err) => {
        // autoplay may be blocked — show prompt but keep src ready
        // If playback failed due to actual stream error, audio 'error' event will fire.
        setStatus('Tekan tombol Play untuk memutar Radio');
      });
    }

    // audio event handlers
    audio.addEventListener('loadstart', ()=> {
      // user-visible loading
      setStatus('Sedang Loading Radio...');
    });
    audio.addEventListener('playing', () => {
      setStatus('Sedang memutar...');
      playBtn.classList.add('playing');
    });
    audio.addEventListener('pause', () => {
      playBtn.classList.remove('playing');
    });
    audio.addEventListener('error', async () => {
      // Special fallback for Shoutcast /; — try alternative url with type=.mp3 (some servers expect parameter)
      const src = audio.src || '';
      if (src && /\/;(\?.*)?$/.test(src) && !src.includes('type=')) {
        try {
          // try adding type=.mp3 (some shoutcast implementations accept it)
          const alt = src.replace(/\/;(\?.*)?$/, '/;type=.mp3');
          audio.src = alt;
          audio.load();
          await audio.play().then(()=> {
            initAudioContext();
            drawVisualizer();
            return;
          }).catch(()=>{ /* fallback to showing error */ });
        } catch (e){}
      }
      // if still error or no alternative -> show message
      setTimeout(()=>{ // short delay to avoid racing autoplay-block messages
        // If user has never tried Play (autoplay blocked), prefer prompt rather than error
        if (!hasTriedPlay) {
          setStatus('Tekan tombol Play untuk memutar Radio');
        } else {
          setStatus('Gagal memutar atau Radio sedang Offline');
          playBtn.classList.remove('playing');
        }
      }, 250);
    });

    // play/stop button logic (kept behavior)
    playBtn.addEventListener('click', () => {
      if (audio.src) {
        initAudioContext();
        audio.play().then(() => {
          audioContext && audioContext.resume && audioContext.resume();
          drawVisualizer();
        }).catch(()=> {
          setStatus('Gagal memutar atau Radio sedang Offline');
        });
      } else {
        // load from hash if no src yet
        loadStreamFromHash();
      }
    });

    stopBtn.addEventListener('click', () => {
      try { audio.pause(); } catch(e){}
      try { audio.currentTime = 0; } catch(e){}
      stopVisualizer();
      setStatus('Tekan tombol Play untuk memutar Radio');
      playBtn.classList.remove('playing');
      cleanupPlayers();
      audio.removeAttribute('src');
      audio.load();
      hasTriedPlay = false;
    });

    modeToggle.addEventListener('click', () => {
      modeIndex = (modeIndex + 1) % modes.length;
      mode = modes[modeIndex];
      modeToggle.textContent = 'Mode: ' + mode.charAt(0).toUpperCase() + mode.slice(1);
    });

    // load stream from hash (main entry)
    function loadStreamFromHash() {
      const streamUrl = decodeURIComponent(window.location.hash.substring(1)).trim();
      if (!streamUrl) {
        setStatus('Tekan tombol Play untuk memutar Radio');
        return;
      }
      // keep original behavior: try to play/resolve stream smartly
      detectStreamTypeAndPlay(streamUrl);
      // clear album art (we don't fetch art here)
      document.getElementById('albumArt').style.backgroundImage = '';
    }

    window.addEventListener('hashchange', loadStreamFromHash);

    // Stop totally when leaving tab
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !document.hiddenByScreenOff) {
        // stop playback fully
        try { audio.pause(); } catch(e){}
        try { audio.currentTime = 0; } catch(e){}
        stopVisualizer();
        setStatus('Tekan tombol Play untuk memutar Radio');
        playBtn.classList.remove('playing');
        cleanupPlayers();
        audio.removeAttribute('src');
        audio.load();
        hasTriedPlay = false;
      }
    });

    window.addEventListener('beforeunload', () => {
      try { audio.pause(); } catch(e){}
      try { audio.currentTime = 0; } catch(e){}
      cleanupPlayers();
    });

    // initial
    setStatus('Tekan tombol Play untuk memutar Radio');
    // if hash present, keep ready but don't force-play (keputusan: keep like "old" behavior)
    // loadStreamFromHash(); // do not auto-start; keep Play button consistent with your earlier working behavior
  </script>
</body>
</html>
