<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radio Player with Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }
    #albumArt {
      width: 200px;
      height: 200px;
      background: #111 center/cover no-repeat;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    #status {
      margin-bottom: 10px;
      font-size: 16px;
      color: #ccc;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    #playBtn {
      background: blue;
      color: white;
      border: 1px solid #444;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    #playBtn:hover {
      background: #0040ff;
    }
    #stopBtn {
      background: red;
      color: white;
      border: 1px solid #444;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
    }
    #stopBtn:hover {
      background: #cc0000;
    }
    #visualizer {
      width: 100%;
      height: 200px;
    }
    #modeToggle {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      font-size: 14px;
      color: white;
    }
  </style>
</head>
<body>
  <div id="albumArt"></div>

  <div id="status">Tekan tombol Play untuk memutar Radio</div>

  <canvas id="visualizer"></canvas>

  <div id="controls">
    <button id="playBtn">PLAY</button>
    <button id="stopBtn">STOP</button>
  </div>

  <button id="modeToggle">Mode: Bar</button>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const albumArt = document.getElementById('albumArt');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const modeToggle = document.getElementById('modeToggle');
    const statusText = document.getElementById('status');

    const modes = ['bar', 'wave', 'circle'];
    let modeIndex = 0;
    let mode = modes[modeIndex];
    let hue = 0;

    let audioContext, source, analyser, dataArray, bufferLength, animationId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = 200;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        source = audioContext.createMediaElementSource(audio);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (mode === 'bar') {
        analyser.getByteFrequencyData(dataArray);
        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i] / 2;
          ctx.fillStyle = 'rgb(' + (barHeight + 100) + ',50,50)';
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      } else if (mode === 'wave') {
        analyser.getByteTimeDomainData(dataArray);
        ctx.beginPath();
        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * canvas.height / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (mode === 'circle') {
        analyser.getByteTimeDomainData(dataArray);
        const radius = 80;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Buat path luar untuk garis plasma
        ctx.beginPath();
        for (let i = 0; i < bufferLength; i++) {
          const angle = (i / bufferLength) * 2 * Math.PI;
          const v = dataArray[i] / 128.0;
          const r = radius + v * 30;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        hue = (hue + 2) % 360;
        const color = `hsl(${hue}, 100%, 60%)`;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 25;
        ctx.shadowColor = color;
        ctx.stroke();

        // Fill bagian dalam seperti plasma berdenyut
        ctx.fillStyle = `hsla(${hue}, 100%, 60%, 0.2)`;
        ctx.fill();

        ctx.shadowBlur = 0;
      }
    }

    function stopVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    playBtn.addEventListener('click', () => {
      if (audio.src) {
        initAudioContext();
        audio.play().then(() => {
          audioContext.resume();
          drawVisualizer();
          statusText.textContent = "Sedang memutar...";
        }).catch(() => {
          statusText.textContent = "Tekan tombol Play untuk memutar Radio";
        });
      }
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      stopVisualizer();
      statusText.textContent = "Tekan tombol Play untuk memutar Radio";
    });

    modeToggle.addEventListener('click', () => {
      modeIndex = (modeIndex + 1) % modes.length;
      mode = modes[modeIndex];
      modeToggle.textContent = 'Mode: ' + mode.charAt(0).toUpperCase() + mode.slice(1);
    });

    function loadStreamFromHash() {
      const streamUrl = decodeURIComponent(window.location.hash.substring(1));
      if (streamUrl) {
        audio.src = streamUrl;
        audio.play().then(() => {
          initAudioContext();
          drawVisualizer();
          statusText.textContent = "Sedang memutar...";
        }).catch(() => {
          // ⬇️ Kalau autoplay ditolak, status langsung ke teks normal tanpa error
          statusText.textContent = "Tekan tombol Play untuk memutar Radio";
        });
        albumArt.style.backgroundImage = '';
      } else {
        statusText.textContent = "Tekan tombol Play untuk memutar Radio";
      }
    }

    window.addEventListener('hashchange', loadStreamFromHash);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        audio.pause();
        stopVisualizer();
        statusText.textContent = "Tekan tombol Play untuk memutar Radio";
      }
    });

    window.addEventListener('beforeunload', () => {
      audio.pause();
      audio.currentTime = 0;
    });

    loadStreamFromHash();
  </script>
</body>
</html>
