<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Player + Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #artwork {
      width: 200px;
      height: 200px;
      background: #111 center/cover no-repeat;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    #controls {
      margin-bottom: 20px;
    }
    button {
      background: lime;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    canvas {
      width: 100%;
      height: 200px;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>

  <div id="artwork"></div>
  <div id="controls">
    <button id="playBtn">PLAY</button>
    <button id="stopBtn">STOP</button>
  </div>
  <audio id="radioPlayer" crossorigin="anonymous"></audio>
  <canvas id="visualizer"></canvas>

  <script>
    const audio = document.getElementById('radioPlayer');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const artwork = document.getElementById('artwork');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, source, animationId;

    // Ambil URL radio dari hash
    function getRadioURL() {
      const hash = window.location.hash;
      return hash ? decodeURIComponent(hash.substring(1)) : '';
    }

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 256;
      }
    }

    function drawVisualizer() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const barHeight = dataArray[i] / 2;
          ctx.fillStyle = 'lime';
          ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      draw();
    }

    function stopVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    playBtn.addEventListener('click', async () => {
      const url = getRadioURL();
      if (!url) return alert('Masukkan URL radio di hash browser');

      audio.src = url;
      initAudioContext();

      try {
        await audio.play();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        drawVisualizer();
      } catch (e) {
        console.error('Gagal play:', e);
      }
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.src = '';
      stopVisualizer();
    });

    // Responsif canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = 200;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Autoload radio URL jika ada di hash
    window.addEventListener('load', () => {
      if (getRadioURL()) {
        playBtn.click(); // User masih harus klik pertama agar audioCtx tidak diblokir
      }
    });

    // Gambar album art jika tersedia dari metadata (opsional)
    audio.addEventListener('loadedmetadata', () => {
      // Beberapa server shoutcast/icecast bisa kirim ICY metadata
      // Tapi tidak semua support → fallback kosong
      artwork.style.backgroundImage = 'url()';
    });
  </script>
</body>
</html>
